[project]
name = "findstill"
version = "0.2.0"
description = "Local Apple Photos visual search with a gallery and JSON CLI"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "torch>=2.7,<3",
    "transformers>=4.51,<5",
    "safetensors>=0.5,<1",
    "httpx>=0.28,<1",
    "sentencepiece>=0.2,<1",
    "protobuf>=5,<8",
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.urls]
Repository = "https://github.com/ABCastor/findstill"

[project.scripts]
findstill = "media_search.cli:main"
media-search = "media_search.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/media_search"]

[tool.hatch.build.targets.sdist]
include = ["src/", "native/", "tests/", "scripts/", "docs/", "agent-skill/", ".github/", "README.md", "LICENSE", "NOTICE", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel.force-include]
"native/ocr.swift" = "media_search/native/ocr.swift"
[tool.pytest.ini_options]
testpaths = ["tests"]
